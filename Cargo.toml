[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/lubaretsi/georgian-for-garmin"

[workspace.dependencies]
georgian-for-garmin-core = { path = "crates/core" }
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
jsonschema = { version = "0.61", default-features = false }
nusb = "0.2.9"
os_info = { version = "3.15", default-features = false }
qrcode = { version = "0.15", default-features = false, features = ["std", "svg"] }
roxmltree = "0.21"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
url = "2"
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_PortableDevices",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

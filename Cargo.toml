[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lubaretsi/georgian-for-garmin"

[workspace.dependencies]
georgian-for-garmin-core = { path = "crates/core" }
clap = { version = "4.6", features = ["derive"] }
jsonschema = { version = "0.61", default-features = false }
nusb = "0.2.9"
roxmltree = "0.21"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

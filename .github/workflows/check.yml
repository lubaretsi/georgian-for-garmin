# Font build and Rust checks. Linux only: macOS runners cost 10x the minutes, and the macOS build
# runs in release.yml.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # Every push to main gets a complete run; a newer push to a pull request replaces the older run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ github.token }}

      # Builds the fonts on Linux and checks every Georgian font against its pinned SHA-256; the
      # builder tests also round-trip every pinned stock font and render the test text over
      # every watch report fixture.
      - name: nix flake check
        run: nix flake check --print-build-logs

      # The render report: a PNG per fixture, with Garmin's fonts and with ours, and report.json
      # with each character's state (the check above already built it).
      - name: Render report
        run: nix build .#checks.x86_64-linux.builder --out-link render-report

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-report
          path: render-report/render/
          if-no-files-found: error

      - name: Rust toolchain matches nixpkgs
        run: scripts/check-rust-toolchain.sh

      - name: Build the dev shell
        run: nix develop --command true

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt
        run: nix develop --command cargo fmt --all --check

      - name: cargo clippy
        run: nix develop --command cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo clippy (app demo)
        run: >-
          nix develop --command cargo clippy --locked -p georgian-for-garmin-app --all-targets
          --features demo -- -D warnings

      - name: cargo test
        run: nix develop --command cargo test --locked --workspace

      # The development operations (cargo feature `dev`), which release builds never have.
      - name: cargo clippy and test (dev operations)
        run: |
          nix develop --command cargo clippy --locked -p georgian-for-garmin-core \
            -p georgian-for-garmin --all-targets --features dev -- -D warnings
          nix develop --command cargo test --locked -p georgian-for-garmin-core \
            -p georgian-for-garmin --features dev

      # The builder's Watch client against the dev CLI: every request it builds checked against
      # the operations' declared input schemas, every operation having a method
      # (test_rpc_contract.py), and the real rpc with calls the core refuses before it looks for
      # a watch, and a terminal's Ctrl-C during wait_for_watch (test_watch.py). No watch is
      # attached here (GFG_TEST_NO_WATCH).
      - name: Watch client against the dev rpc
        run: |
          nix develop --command cargo build --locked -p georgian-for-garmin --features dev
          nix develop --command bash -c 'cd builder &&
            GEORGIAN_FOR_GARMIN_CLI="$PWD/../target/debug/georgian-for-garmin" GFG_TEST_NO_WATCH=1 \
            pytest -q -rs tests/test_rpc_contract.py tests/test_watch.py'

      # The omp eval route: `nix run .#omp-venv` writes .venv, whose python imports the toolkit
      # and draws Georgian in the pinned environment, from another directory too.
      - name: omp-venv
        run: |
          nix run .#omp-venv
          (cd /tmp && "$GITHUB_WORKSPACE/.venv/bin/python" -c 'import warnings
          warnings.simplefilter("error")
          from garmin_fonts.build import add_georgian
          assert add_georgian("006-D8947-22", offline=True).rasterizer_pinned')

      # The Windows backend is cfg(windows): type-check it for both Windows targets from Linux.
      # Clippy doesn't link, so no Windows SDK is needed.
      - name: cargo clippy (Windows targets)
        run: |
          fonts=$(nix build .#fonts --no-link --print-out-paths)
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component clippy \
            --target x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
          for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            for features in "" "--features dev"; do
              GEORGIAN_FOR_GARMIN_FONTS=$fonts cargo "+$toolchain" clippy --locked \
                -p georgian-for-garmin-core -p georgian-for-garmin --all-targets --target "$target" \
                $features -- -D warnings
            done
          done

  # The new app UI (crates/app/frontend): the generated core types match the CLI, typecheck,
  # Vitest (flow, copy, components) and every story with its play function and axe in Chromium
  # and WebKit. Node and pnpm come from the dev shell; Playwright's browsers, at the lockfile's
  # version, are installed outside nix.
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crates/app/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ github.token }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: pnpm install
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Generated types match the CLI and the app
        run: |
          nix develop --command pnpm gen:types
          git diff --exit-code -- src/core/types.gen.ts

      - name: Typecheck
        run: nix develop --command pnpm typecheck

      # What the app embeds (tauri.conf.json's frontendDist); the release builds run the same
      # through Tauri's beforeBuildCommand.
      - name: Build
        run: nix develop --command pnpm build

      # The browsers' system libraries come from apt (--with-deps), at the lockfile's Playwright
      # version.
      - name: Playwright browsers
        run: nix develop --command pnpm exec playwright install --with-deps chromium webkit

      # The browsers are Ubuntu programs and need Ubuntu's environment, not the dev shell's: in
      # `nix develop` on Linux, `ldd` is nix's (Playwright's library check then finds none of
      # apt's libraries), and the shell's GTK settings (GDK_PIXBUF_MODULE_FILE, XDG_DATA_DIRS)
      # make WebKit fail to load pages. So the tests run with only the dev shell's node and pnpm
      # on PATH, in front of the system's.
      - name: Vitest and story tests
        run: |
          nix develop --command bash -c 'exec env -i HOME="$HOME" CI="$CI" \
            PATH="$(dirname "$(command -v node)"):$(dirname "$(command -v pnpm)"):/usr/local/bin:/usr/bin:/bin" \
            pnpm test'

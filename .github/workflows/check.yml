# Font build and Rust checks. Linux only: macOS runners cost 10x the minutes, and the macOS build
# runs in release.yml.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # Every push to main gets a complete run; a newer push to a pull request replaces the older run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ github.token }}

      # Builds the fonts on Linux and checks every Georgian font against its pinned SHA-256; the
      # builder tests also round-trip every pinned stock font and render the test text over
      # every watch report fixture.
      - name: nix flake check
        run: nix flake check --print-build-logs

      # The render report: a PNG per fixture, with Garmin's fonts and with ours, and report.json
      # with each character's state (the check above already built it).
      - name: Render report
        run: nix build .#checks.x86_64-linux.builder --out-link render-report

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-report
          path: render-report/render/
          if-no-files-found: error

      - name: Rust toolchain matches nixpkgs
        run: scripts/check-rust-toolchain.sh

      - name: Build the dev shell
        run: nix develop --command true

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt
        run: nix develop --command cargo fmt --all --check

      - name: cargo clippy
        run: nix develop --command cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo clippy (app demo)
        run: >-
          nix develop --command cargo clippy --locked -p georgian-for-garmin-app --all-targets
          --features demo -- -D warnings

      - name: cargo test
        run: nix develop --command cargo test --locked --workspace

      # The development operations (cargo feature `dev`), which release builds never have.
      - name: cargo clippy and test (dev operations)
        run: |
          nix develop --command cargo clippy --locked -p georgian-for-garmin-core \
            -p georgian-for-garmin --all-targets --features dev -- -D warnings
          nix develop --command cargo test --locked -p georgian-for-garmin-core \
            -p georgian-for-garmin --features dev

      # The Windows backend is cfg(windows): type-check it for both Windows targets from Linux.
      # Clippy doesn't link, so no Windows SDK is needed.
      - name: cargo clippy (Windows targets)
        run: |
          fonts=$(nix build .#fonts --no-link --print-out-paths)
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component clippy \
            --target x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
          for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            for features in "" "--features dev"; do
              GEORGIAN_FOR_GARMIN_FONTS=$fonts cargo "+$toolchain" clippy --locked \
                -p georgian-for-garmin-core -p georgian-for-garmin --all-targets --target "$target" \
                $features -- -D warnings
            done
          done

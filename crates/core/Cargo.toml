[package]
name = "georgian-for-garmin-core"
description = "Operations and a minimal MTP client for staging Georgian fonts on Garmin watches"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
# Development operations (read_file, stage_file, remove_staged): debug builds only; a release
# build with it fails to compile.
dev = []

[dependencies]
jsonschema.workspace = true
roxmltree.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
os_info.workspace = true
url.workspace = true

[target.'cfg(not(windows))'.dependencies]
nusb.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[build-dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

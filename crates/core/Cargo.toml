[package]
name = "georgian-for-garmin-core"
description = "Operations and a minimal MTP client for staging Georgian fonts on Garmin watches"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
# Development operations (read_file, stage_file, remove_staged, and the raw MTP operations and
# live trace of `ops.rs`): debug builds only; a release build with it fails to compile.
dev = ["dep:base64"]
# The examples' support list (`example_watches`) in place of the registry's, for the UI fixtures,
# the demo build and tests: debug builds only; a release build with it fails to compile.
example-watches = []

[dependencies]
base64 = { workspace = true, optional = true }
jsonschema.workspace = true
roxmltree.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
os_info.workspace = true
url.workspace = true

[target.'cfg(not(windows))'.dependencies]
nusb.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
# The UI fixtures (tests/ui_fixtures.rs) show the examples' support list.
georgian-for-garmin-core = { path = ".", features = ["example-watches"] }

[build-dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

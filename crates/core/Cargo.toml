[package]
name = "georgian-for-garmin-core"
description = "Operations and a minimal MTP client for staging Georgian fonts on Garmin watches"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
# Development operations (read_file, stage_file, remove_staged, and the raw MTP operations and
# live trace of `ops.rs`): debug builds only; a release build with it fails to compile.
dev = ["dep:base64"]

[dependencies]
base64 = { workspace = true, optional = true }
jsonschema.workspace = true
roxmltree.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
os_info.workspace = true
url.workspace = true

[target.'cfg(not(windows))'.dependencies]
nusb.workspace = true
# check_update's one HTTPS request: rustls with built-in roots (the Linux CLI is static).
ureq = { workspace = true, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows.workspace = true
# Windows' own TLS (SChannel) and certificate store: no C code to build, so the Windows targets
# still type-check from Linux.
ureq = { workspace = true, features = ["native-tls-no-default"] }

[build-dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

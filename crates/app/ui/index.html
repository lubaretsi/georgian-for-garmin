<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <nav id="languages" class="languages" hidden></nav>
    <div class="mark" aria-hidden="true">ქ</div>
    <p id="demo" class="badge" data-t="demo" hidden></p>

    <main id="waiting" class="view">
      <h1 data-t="waitingTitle"></h1>
      <p data-t="waitingBody"></p>
      <div id="waiting-problem" hidden>
        <p id="waiting-hint" class="hint"></p>
        <button id="waiting-retry" class="secondary" data-t="tryAgain"></button>
      </div>
      <p class="quiet"><span class="spinner small"></span><span data-t="looking"></span></p>
      <section id="waiting-help" class="help" aria-live="polite" hidden>
        <h2 data-t="waitingHelpTitle"></h2>
        <ul>
          <li id="waiting-help-express"></li>
          <li data-t="waitingHelpReplug"></li>
          <li data-t="waitingHelpCable"></li>
        </ul>
      </section>
    </main>

    <main id="ready" class="view" hidden>
      <h1 id="ready-model"></h1>
      <p id="ready-version" class="quiet"></p>
      <p id="ready-support" class="tested" hidden></p>
      <p id="ready-untested" class="quiet small" data-t="untestedBody" hidden></p>
      <p id="ready-note" class="note" hidden></p>
      <button id="ready-follow" class="link" hidden></button>
      <div id="ready-actions" class="actions">
        <button id="install" class="primary" data-t="install"></button>
        <button id="restore" class="secondary" data-t="restore"></button>
      </div>
      <div id="share" class="share" hidden>
        <p id="share-why" class="quiet small" data-t="shareWhy"></p>
        <details class="shared">
          <summary data-t="sharedSummary"></summary>
          <p class="small" data-t="sharedWhat"></p>
          <pre id="share-text" class="report"></pre>
        </details>
        <button id="share-button" class="link" data-t="share"></button>
        <p id="share-result" class="quiet small result" role="status" hidden></p>
      </div>
    </main>

    <main id="drive" class="view" hidden>
      <h1 id="drive-model"></h1>
      <p id="drive-version" class="quiet"></p>
      <p class="note" data-t="driveBody"></p>
      <p id="drive-reason" class="note" hidden></p>
      <button id="drive-follow" class="link" hidden></button>
      <div id="drive-share-box" class="share">
        <p class="quiet small" data-t="driveShareWhy"></p>
        <details class="shared">
          <summary data-t="sharedSummary"></summary>
          <p class="small" data-t="sharedWhat"></p>
          <pre id="drive-text" class="report"></pre>
        </details>
        <button id="drive-share" class="primary" data-t="shareGithub"></button>
        <p id="drive-result" class="quiet small result" role="status" hidden></p>
      </div>
    </main>

    <main id="working" class="view" hidden>
      <div class="spinner"></div>
      <h1 id="working-title"></h1>
      <p class="quiet" data-t="keepConnected"></p>
    </main>

    <main id="staged" class="view" hidden>
      <h1 data-t="stagedTitle"></h1>
      <p data-t="unplugRestart"></p>
      <p id="staged-sizes"></p>
      <ul id="staged-packs" class="packs quiet small"></ul>
      <p id="staged-after"></p>
      <div id="staged-test" class="test">
        <p class="quiet" data-t="testLabel"></p>
        <p class="test-line" data-t="testLine" lang="ka"></p>
        <p class="quiet small" data-t="restartAgain"></p>
      </div>
      <div class="actions">
        <button id="check" class="primary" data-t="checkOnWatch"></button>
        <button id="done" class="secondary" data-t="done"></button>
      </div>
    </main>

    <main id="checking" class="view check" hidden>
      <h1 data-t="checkTitle"></h1>
      <p id="check-confirmed" class="note" data-t="checkConfirmed" hidden></p>
      <div id="check-phone" class="phone">
        <img id="check-qr" class="qr" alt="">
        <div>
          <p class="small" data-t="checkScan"></p>
          <p class="quiet small" data-t="checkOr"></p>
          <p class="test-line small-line" data-t="testLine" lang="ka"></p>
          <p class="quiet small" data-t="restartAgain"></p>
        </div>
      </div>

      <fieldset class="question">
        <legend data-t="askResult"></legend>
        <div id="ask-result" class="choices"></div>
      </fieldset>
      <fieldset id="ask-views-box" class="question" hidden>
        <legend data-t="askViews"></legend>
        <div id="ask-views" class="choices"></div>
      </fieldset>
      <fieldset id="ask-marker-box" class="question" hidden>
        <legend data-t="askMarker"></legend>
        <p class="quiet small" data-t="askMarkerHint"></p>
        <div id="ask-marker" class="choices pictures"></div>
      </fieldset>
      <fieldset class="question">
        <legend data-t="askPhone"></legend>
        <div id="ask-phone" class="choices"></div>
      </fieldset>

      <details class="shared" open>
        <summary data-t="sharedSummary"></summary>
        <p class="small" data-t="sharedWhat"></p>
        <p id="check-paste" class="note small" data-t="sharePasteAhead" hidden></p>
        <pre id="check-text" class="report"></pre>
      </details>
      <div class="actions">
        <button id="check-share" class="primary"></button>
        <p id="check-result" class="quiet small result" role="status" hidden></p>
        <button id="check-done" class="secondary" data-t="done"></button>
      </div>
    </main>

    <main id="error" class="view" hidden>
      <h1 data-t="errorTitle"></h1>
      <p id="error-message"></p>
      <details>
        <summary data-t="details"></summary>
        <code id="error-details"></code>
      </details>
      <div class="actions">
        <button id="retry" class="primary" data-t="tryAgain"></button>
        <button id="error-report" class="secondary" data-t="reportProblem" hidden></button>
      </div>
    </main>
  </body>
</html>
